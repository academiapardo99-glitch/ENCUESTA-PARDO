name = "encuesta-estudiantes"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Portal público: se sirve el build de frontend-estudiante (raíz del dominio).
# Compila antes con:  cd frontend-estudiante && npm run build
[assets]
directory = "../frontend-estudiante/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Primero llega al Worker para distinguir /api de las rutas SPA. El Worker
# reenvía las rutas no API al binding ASSETS.
run_worker_first = true

# Variables de entorno NO secretas (las secretas se añaden con `wrangler secret put`)
[vars]
PORTAL_ESTUDIANTE_PUBLICO = "true"

# Secrets que debes añadir con:
#   wrangler secret put SUPABASE_URL   (https://xxxx.supabase.co)
#   wrangler secret put SUPABASE_KEY   (anon/public key)
# El esquema de las tablas está en supabase-schema.sql.

